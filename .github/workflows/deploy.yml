name: Auto Deploy Server API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy koh-server to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Auto-Deploy Webhook on VPS
        run: |
          echo "🚀 Triggering auto-deployment for koh-server on Hostinger VPS..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "http://189.72.176.145/api/webhook/deploy" \
            -H "Content-Type: application/json" \
            -d '{"project": "server", "secret": "koh_auto_deploy_2026"}')
          
          BODY=$(echo "$RESPONSE" | sed -e '$d')
          STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
          
          echo "Response: $BODY"
          echo "HTTP Code: $STATUS"
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Auto-deploy trigger failed with status code $STATUS"
            exit 1
          fi
          echo "✅ Auto-deploy successfully initiated on VPS!"
